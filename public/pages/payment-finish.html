<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Successful — Avaia Studio</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div style="text-align:center;padding:40px 24px;max-width:480px">
    <div style="width:72px;height:72px;border:2px solid var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4a7a48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 style="font-family:var(--fd);font-size:32px;font-weight:600;margin-bottom:12px">Payment Successful!</h1>
    <p style="color:var(--mt);font-size:15px;line-height:1.8;margin-bottom:8px" id="fin-msg">Your booking has been confirmed.</p>
    <p style="color:var(--mt);font-size:13px;margin-bottom:32px" id="fin-order"></p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/dashboard" class="btn bp">View Dashboard</a>
      <a href="/schedule"  class="btn bo">Book Another Class</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || params.get('orderId');
    const status  = params.get('transaction_status');
    if (orderId) document.getElementById('fin-order').textContent = 'Order ID: ' + orderId;
    if (status === 'pending') {
      document.getElementById('fin-msg').textContent = 'Your payment is being processed. The booking will be confirmed once payment is received.';
    }
    // Auto-confirm if coming from simulation
    const sim = params.get('simulated');
    if (sim) document.getElementById('fin-msg').textContent = 'Simulated payment successful. Your booking has been confirmed.';
  </script>
</body>
</html>
