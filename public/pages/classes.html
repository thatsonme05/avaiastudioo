<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Classes — Avaia Studio</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/classes.css">
  <script>window.PAGE_ID='classes'; window.PAGE_TITLE='Classes';</script>
</head>
<body>
<nav class="navbar" id="main-nav"></nav>
<div class="nav-overlay" id="nav-overlay" onclick="closeDrawer()"></div>
<div class="nav-drawer">
  <div class="drawer-head"><img src="/img/logo-dark.svg" class="brand-icon" alt="Avaia Studio"></div>
  <div class="drawer-nav"></div>
  <div class="drawer-foot"></div>
</div>
<div style="padding-top:var(--nav)">
  <div class="page-top">
    <div class="page-top-in">
      <p class="eye" data-i18n="classes.eyebrow">Our Studio</p>
      <h1 class="h2" data-i18n="classes.title">All Classes</h1>
    </div>
  </div>
  <div class="cls-wrap">
    <div class="cls-filter" id="cls-filter">
      <button class="fbtn active" onclick="filterCls('all',this)" data-i18n="classes.filter.all">All</button>
      <button class="fbtn" onclick="filterCls('All Levels',this)" data-i18n="classes.filter.alllevels">All Levels</button>
      <button class="fbtn" onclick="filterCls('Beginner',this)" data-i18n="classes.filter.beginner">Beginner</button>
      <button class="fbtn" onclick="filterCls('Intermediate',this)">Intermediate</button>
    </div>
    <div class="cls-grid2" id="cls-grid">
      <div class="skel" style="height:180px"></div>
      <div class="skel" style="height:180px"></div>
      <div class="skel" style="height:180px"></div>
    </div>
  </div>
</div>
<footer id="main-footer"></footer>
<script src="/js/i18n.js?v=20260829forgotpw1"></script>
<script src="/js/core.js?v=20260829forgotpw1"></script>
<script>
let allCls = [], curFilter = 'all';
function filterCls(f, btn) {
  curFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCls();
}
function renderCls() {
  const g = document.getElementById('cls-grid');
  if (!g) return;
  const list = curFilter === 'all' ? allCls : allCls.filter(c => c.level === curFilter);
  if (!list.length) { g.innerHTML=`<p style="padding:40px;color:var(--mt);grid-column:span 3">${t('classes.noclasses')}</p>`; return; }
  g.innerHTML = list.map(c=>`
    <div class="cls-card2">
      <p class="cls-tag2">${c.level}</p>
      <h3 class="h3" style="margin-bottom:6px">${c.name}</h3>
      <p style="font-size:13px;color:var(--mt);margin-bottom:4px">${c.instructor}</p>
      <p class="sm">${t('classes.capacity')}: ${c.capacity} ${t('classes.people')}</p>
      <div class="cls-ft2">
        <span class="sm">${c.duration}</span>
        <a href="/schedule" class="btn bp bsm">${t('classes.viewschedule')}</a>
      </div>
    </div>`).join('');
}
async function pageInit() {
  try {
    const r = await fetch('/api/classes');
    allCls = await r.json();
    renderCls();
  } catch(e) { document.getElementById('cls-grid').innerHTML=`<p style="padding:40px;color:var(--mt)">${t('classes.failedload')}</p>`; }
}
</script>
</body>
</html>
