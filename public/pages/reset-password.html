<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — Avaia Studio</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div style="width:100%;max-width:420px;padding:40px 24px">
    <p class="m-eye" style="text-align:center">Avaia Studio</p>
    <h1 style="font-family:var(--fd);font-size:30px;font-weight:600;margin-bottom:8px;text-align:center" id="rp-title">Set a New Password</h1>
    <p style="color:var(--mt);font-size:14px;text-align:center;margin-bottom:28px" id="rp-sub">Choose a new password for your account.</p>

    <div id="rp-form">
      <div class="fg"><label class="fl">New Password</label><input type="password" class="fi" id="rp-pw" placeholder="At least 8 characters" onkeydown="if(event.key==='Enter')doResetPassword()"></div>
      <div class="fg"><label class="fl">Confirm New Password</label><input type="password" class="fi" id="rp-cf" placeholder="••••••••" onkeydown="if(event.key==='Enter')doResetPassword()"></div>
      <button class="btn bp" style="width:100%" onclick="doResetPassword()" id="rp-submit">Reset Password</button>
    </div>

    <div id="rp-ok" style="display:none;text-align:center">
      <div class="ok-icon" style="margin:0 auto 16px"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h3 style="font-family:var(--fd);font-size:22px;font-weight:600;margin-bottom:8px">Password Updated</h3>
      <p style="font-size:14px;color:var(--mt);margin-bottom:20px">You're all set — and signed in.</p>
      <a href="/dashboard" class="btn bp" style="width:100%;display:block;text-align:center;box-sizing:border-box">Go to Dashboard</a>
    </div>

    <div id="rp-invalid" style="display:none;text-align:center">
      <p style="font-size:14px;color:var(--mt);line-height:1.8;margin-bottom:20px" id="rp-invalid-msg">This password reset link is invalid or has expired.</p>
      <a href="/" class="btn bo" style="width:100%;display:block;text-align:center;box-sizing:border-box">Back Home</a>
    </div>
  </div>

  <script src="/js/i18n.js?v=20260829forgotpw1"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    const formEl    = document.getElementById('rp-form');
    const okEl      = document.getElementById('rp-ok');
    const invalidEl = document.getElementById('rp-invalid');
    const titleEl   = document.getElementById('rp-title');
    const subEl     = document.getElementById('rp-sub');

    function showInvalid(msg){
      formEl.style.display = 'none';
      titleEl.textContent = 'Link Invalid';
      subEl.style.display = 'none';
      document.getElementById('rp-invalid-msg').textContent = msg || 'This password reset link is invalid or has expired.';
      invalidEl.style.display = 'block';
    }

    function toastInline(msg){
      subEl.style.color = '#a33d3d';
      subEl.textContent = msg;
    }

    async function doResetPassword(){
      const pw = document.getElementById('rp-pw').value;
      const cf = document.getElementById('rp-cf').value;
      if(!pw || pw.length < 8){ toastInline('Password must be at least 8 characters.'); return; }
      if(pw !== cf){ toastInline("Passwords don't match."); return; }

      const btn = document.getElementById('rp-submit');
      btn.disabled = true; btn.textContent = 'Please wait…';
      try{
        const r = await fetch('/api/auth/reset-password', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token, password: pw }),
        });
        const d = await r.json();
        if(d.ok){
          try{
            localStorage.removeItem('avaia_staff');
            localStorage.removeItem('avaia_staff_user');
            localStorage.setItem('avaia_member_token', d.token);
            localStorage.setItem('avaia_u', JSON.stringify(d.user));
          }catch(e){}
          formEl.style.display = 'none';
          subEl.style.display = 'none';
          okEl.style.display = 'block';
        }else{
          btn.disabled = false; btn.textContent = 'Reset Password';
          toastInline(d.error || 'Could not reset your password. Please try again.');
        }
      }catch(e){
        btn.disabled = false; btn.textContent = 'Reset Password';
        toastInline('Connection error. Please try again.');
      }
    }

    if(!token) showInvalid('No reset token was provided. Please use the link from your email.');
  </script>
</body>
</html>
