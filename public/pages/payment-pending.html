<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Pending — Avaia Studio</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div style="text-align:center;padding:40px 24px;max-width:480px">
    <div style="width:72px;height:72px;border:2px solid var(--a);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--a)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <h1 style="font-family:var(--fd);font-size:32px;font-weight:600;margin-bottom:12px">Payment Pending</h1>
    <p style="color:var(--mt);font-size:15px;line-height:1.8;margin-bottom:8px">Your booking is awaiting payment confirmation.</p>
    <p style="color:var(--mt);font-size:13px;margin-bottom:32px" id="pend-order"></p>
    <p style="font-size:13px;color:var(--mt);margin-bottom:32px">Complete your payment within <strong>24 hours</strong>. The booking will be automatically confirmed once payment is received.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/dashboard" class="btn bp">Check Status</a>
      <a href="/"          class="btn bo">Back to Home</a>
    </div>
  </div>
  <script>
    const orderId = new URLSearchParams(window.location.search).get('order_id');
    if (orderId) document.getElementById('pend-order').textContent = 'Order ID: ' + orderId;
  </script>
</body>
</html>
