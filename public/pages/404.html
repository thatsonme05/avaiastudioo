<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page Not Found</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .nf{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
    .nf-inner{max-width:480px}
    .nf-num{font-family:var(--fd);font-size:clamp(80px,15vw,140px);font-weight:600;color:var(--p);line-height:1;opacity:.12;margin-bottom:8px}
    .nf-title{font-family:var(--fd);font-size:clamp(24px,4vw,36px);font-weight:600;margin-bottom:12px}
    .nf-sub{color:var(--mt);font-size:15px;line-height:1.8;margin-bottom:32px}
    .nf-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  </style>
</head>
<body>
<div class="nf">
  <div class="nf-inner">
    <div class="nf-num">404</div>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-sub">The page you're looking for doesn't exist or has been moved.<br>Try heading back to the homepage or check our class schedule.</p>
    <div class="nf-links">
      <a href="/" class="btn bp">Back to Home</a>
      <a href="/schedule" class="btn bo">View Schedule</a>
    </div>
  </div>
</div>
</body>
</html>
