<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Failed — Avaia Studio</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div style="text-align:center;padding:40px 24px;max-width:480px">
    <div style="width:72px;height:72px;border:2px solid #b52b2b;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b52b2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <h1 style="font-family:var(--fd);font-size:32px;font-weight:600;margin-bottom:12px">Payment Failed</h1>
    <p style="color:var(--mt);font-size:15px;line-height:1.8;margin-bottom:32px">The transaction was unsuccessful. Please try again or contact our studio.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/schedule" class="btn bp">Try Again</a>
      <a href="/"         class="btn bo">Back to Home</a>
    </div>
  </div>

</html>
